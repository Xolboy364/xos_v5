name: Build xOS v5.0 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev pkg-config python3-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Briefcase
        run: pip install briefcase==0.3.19

      - name: Create Android Project
        run: briefcase create android --no-input

      - name: Build APK
        run: briefcase build android --no-input

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xOS-v5-APK
          path: "**/app-debug.apk"
          retention-days: 30
